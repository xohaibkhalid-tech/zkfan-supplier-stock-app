{% extends "base.html" %}{% block t %}Usage{% endblock %}{% block body %}
<div class="card" style="margin-top:10px">
<h3>➖ Rozana istemal (Usage)</h3>
<div class="hint">Jo item factory mein use hua, select karke qty likhein — stock foran kam ho jayega.</div>
<form method="post" class="entry-form">
<label>Item *</label>
<select name="item_name" required autofocus>
  <option value="">— item chunein —</option>
  {% for m in mats %}<option value="{{ m.name }}">{{ m.name }} ({{ m.unit }})</option>{% endfor %}
</select>
<label>Qty use hua *</label>
<input name="qty" type="number" step="any" required placeholder="e.g. 25">
<label>Date</label>
<input name="date" type="date" value="{{ today }}">
<label>Note</label>
<input name="notes" placeholder="e.g. aaj ki production">
<button class="btn green" type="submit" style="padding:20px;font-size:19px">💾 Save (Enter)</button>
<a class="btn gray" data-cancel href="{{ url_for('stock') }}">Cancel (Esc)</a>
</form>
</div>
{% endblock %}
